# Conda environment for ST-Occ (python 3.8, CUDA 11.3), exported from the
# environment used to verify the released model.
#
#   conda env create -f docs/environment.yml
#   conda activate stocc
#
# Three dependencies are intentionally NOT listed here and must be installed
# afterwards following docs/install.md:
#   - torch / torchvision (step b: cu113 wheels from the PyTorch index)
#   - mmcv-full (step c: must be compiled WITH CUDA ops, MMCV_WITH_OPS=1 FORCE_CUDA=1)
#   - this repo itself (step e: pip install -e .)
name: stocc
channels:
  - defaults
dependencies:
  - _libgcc_mutex=0.1
  - _openmp_mutex=5.1
  - ca-certificates=2025.12.2
  - ld_impl_linux-64=2.44
  - libffi=3.4.4
  - libgcc=15.2.0
  - libgcc-ng=15.2.0
  - libgomp=15.2.0
  - libstdcxx=15.2.0
  - libstdcxx-ng=15.2.0
  - libxcb=1.17.0
